name: Build Driver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: Anadir plataforma Android
        run: npx cap add android

      - name: Configurar compatibilidad con Android 6+ (target Android 9)
        run: |
          GRADLE_FILE="android/variables.gradle"
          echo "=== ANTES ==="
          cat $GRADLE_FILE

          # minSdkVersion 23 = Android 6.0 Marshmallow
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' $GRADLE_FILE
          # targetSdkVersion 28 = Android 9.0 Pie (compatible con Galaxy J7 Pro y demas)
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 28/' $GRADLE_FILE
          # compileSdkVersion 28 = compilar contra librerias de Android 9
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 28/' $GRADLE_FILE

          echo "=== DESPUES ==="
          cat $GRADLE_FILE

      - name: Inyectar google-services.json desde secreto
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          echo "google-services.json inyectado:"
          head -c 200 android/app/google-services.json

      - name: Verificar assets
        run: |
          echo "=== Contenido de assets/ ==="
          ls -la assets/ || echo "No existe carpeta assets/"
          echo ""
          echo "=== Verificando archivos requeridos ==="
          for f in icon-only.png icon-foreground.png icon-background.png; do
            if [ -f "assets/$f" ]; then
              echo "OK: assets/$f ($(du -h assets/$f | cut -f1))"
            else
              echo "FALTA: assets/$f  <-- NECESARIO para @capacitor/assets"
            fi
          done
          echo ""
          echo "=== Verificando iconos de notificacion ==="
          for f in ic_stat_ride.png ic_notif_large.png; do
            if [ -f "assets/$f" ]; then
              echo "OK: assets/$f ($(du -h assets/$f | cut -f1))"
            else
              echo "FALTA: assets/$f  <-- NECESARIO para notificaciones"
            fi
          done

      - name: Generar iconos con @capacitor/assets
        run: |
          npx --yes @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#ff7a00' \
            --iconBackgroundColorDark '#0a0a0b' \
            --splashBackgroundColor '#0a0a0b' \
            --splashBackgroundColorDark '#000000'
          echo "Iconos generados por @capacitor/assets"

      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Copiar iconos de notificacion
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/drawable-mdpi $RES/drawable-hdpi $RES/drawable-xhdpi $RES/drawable-xxhdpi $RES/drawable-xxxhdpi

          if [ -f "assets/ic_stat_ride.png" ]; then
            convert assets/ic_stat_ride.png -resize 24x24  $RES/drawable-mdpi/ic_stat_ride.png
            convert assets/ic_stat_ride.png -resize 36x36  $RES/drawable-hdpi/ic_stat_ride.png
            convert assets/ic_stat_ride.png -resize 48x48  $RES/drawable-xhdpi/ic_stat_ride.png
            convert assets/ic_stat_ride.png -resize 72x72  $RES/drawable-xxhdpi/ic_stat_ride.png
            convert assets/ic_stat_ride.png -resize 96x96  $RES/drawable-xxxhdpi/ic_stat_ride.png
            echo "OK: icono de notificacion pequeno copiado"
          else
            echo "AVISO: no existe assets/ic_stat_ride.png"
          fi

          if [ -f "assets/ic_notif_large.png" ]; then
            convert assets/ic_notif_large.png -resize 128x128 $RES/drawable-mdpi/ic_notif_large.png
            convert assets/ic_notif_large.png -resize 192x192 $RES/drawable-hdpi/ic_notif_large.png
            convert assets/ic_notif_large.png -resize 256x256 $RES/drawable-xhdpi/ic_notif_large.png
            convert assets/ic_notif_large.png -resize 384x384 $RES/drawable-xxhdpi/ic_notif_large.png
            convert assets/ic_notif_large.png -resize 512x512 $RES/drawable-xxxhdpi/ic_notif_large.png
            echo "OK: icono de notificacion grande copiado"
          else
            echo "AVISO: no existe assets/ic_notif_large.png"
          fi

      - name: Configurar AndroidManifest con permisos
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST
          sed -i '/<application/i\    <uses-feature android:name="android.hardware.location.gps" android:required="false" />' $MANIFEST
          sed -i '/<application/i\    <uses-feature android:name="android.hardware.camera" android:required="false" />' $MANIFEST
          echo "Permisos anadidos:"
          grep "uses-permission\|uses-feature" $MANIFEST

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verificar versiones del APK compilado
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "=== APK generado ==="
            ls -lh $APK
            echo ""
            echo "=== Verificando SDK versions del APK ==="
            $ANDROID_HOME/build-tools/*/aapt dump badging $APK | grep -E "sdkVersion|targetSdkVersion|package:" || true
          else
            echo "ERROR: no se genero el APK"
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-movil-conductor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
