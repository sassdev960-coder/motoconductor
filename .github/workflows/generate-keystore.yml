name: Generar Keystore para Conductor (solo una vez)

on:
  workflow_dispatch:

jobs:
  generar:
    name: Generar keystore y mostrarlo
    runs-on: ubuntu-latest

    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Generar keystore
        run: |
          keytool -genkeypair -v \
            -keystore conductor.keystore \
            -alias motomovilconductor \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ConductorMotoMovil2026 \
            -keypass ConductorMotoMovil2026 \
            -dname "CN=Moto Movil Conductor, OU=Desarrollo, O=Moto Movil, L=Santa Cruz, ST=Santa Cruz, C=BO"

          echo "✅ Keystore generado"
          ls -la conductor.keystore

      - name: 📝 Convertir a Base64
        run: |
          base64 -w 0 conductor.keystore > keystore_base64.txt

      - name: 📤 Subir keystore como artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-moto-movil-conductor
          path: |
            conductor.keystore
            keystore_base64.txt
          retention-days: 7

      - name: 📋 Mostrar Base64 en el resumen
        run: |
          echo "## 🔑 Keystore del Conductor generado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Alias:** \`motomovilconductor\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Contraseña (store y key):** \`ConductorMotoMovil2026\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Contenido de KEYSTORE_BASE64 (copia TODO):**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat keystore_base64.txt >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Valores para los secretos de GitHub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secreto | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEYSTORE_BASE64\` | (el texto de arriba) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEYSTORE_PASSWORD\` | \`ConductorMotoMovil2026\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEY_ALIAS\` | \`motomovilconductor\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEY_PASSWORD\` | \`ConductorMotoMovil2026\` |" >> $GITHUB_STEP_SUMMARY
